# =============================================================================
# smoketest.ini - configuration for utils/test/smoketest.py
#
# All paths are resolved relative to the repository root unless absolute.
# Edit this file to adapt the smoke test to your environment; the defaults
# match a fresh clone built with utils/build.bat.
# =============================================================================

[paths]
# Directory that contains the built executables (Release by default).
release_dir = build/Release
client_exe = awake.exe
daemon_exe = awake.daemon.exe

[ipc]
# Named pipe the client and the daemon communicate over. Must match the
# pipe name compiled into the executables (ipc.cpp).
pipe_name = awake_daemon

[watch]
# Image name used for the watch-list tests. The app is started and killed
# during the run (a window may flash on screen - that is the "semi-automatic"
# part of the test).
test_app = notepad.exe
# true  = leave the test app running after the test (manual inspection)
# false = kill the test app when the test step is done
keep_window_open = false

[autostart]
# Registry location the client writes the autostart entry to (HKCU).
registry_key = Software\Microsoft\Windows\CurrentVersion\Run
value_name = awake
# true = restore the pre-test autostart state when the test ends.
restore_state = true

[timeouts]
# How long client commands may take at most, in seconds.
command_timeout_s = 30
