# =============================================================================
# release.yml - build and publish a release when a version tag is pushed.
#
# The tag is treated as a claim, not as the source of truth: the workflow
# builds the tree, reads the version the binary reports (which comes from
# CMakeLists.txt, see R8) and refuses to publish unless the two are identical.
# That way a release can never contain a binary that disagrees with its tag.
#
# Release notes come from .github/release-notes/<tag>.md when that file
# exists; otherwise a minimal body is generated. The zip contains the same
# four files as the manual release procedure.
# =============================================================================
name: Release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release for (e.g. 0.6.0-beta)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Resolve the tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = $env:GITHUB_REF_NAME }
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "No tag to release." }
          Write-Host "releasing $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: cmd
        run: utils\build.bat

      # Refuse to publish when the binary and the tag disagree.
      - name: Verify the tag against the built version
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $cmakeLists = Get-Content CMakeLists.txt -Raw
          $version = [regex]::Match($cmakeLists, 'project\(awake VERSION (\d+\.\d+\.\d+)').Groups[1].Value
          $suffix = [regex]::Match($cmakeLists, 'set\(AWAKE_VERSION_SUFFIX "([^"]*)"\)').Groups[1].Value
          $expected = "$version$suffix"
          $reported = (& .\build\Release\awake.exe version) -join ' '
          Write-Host "tag      : $tag"
          Write-Host "expected : $expected"
          Write-Host "reported : $reported"
          if ($tag -ne $expected) {
            throw "Tag '$tag' does not match the built version '$expected'. Bump CMakeLists.txt or fix the tag."
          }
          if ($reported -notmatch [regex]::Escape($expected)) {
            throw "The binary reports '$reported' instead of '$expected'."
          }

      - name: Package
        shell: pwsh
        run: |
          $stage = "build\stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item build\Release\awake.exe, build\Release\awake.daemon.exe, LICENSE, NOTICE, README.md, README.zh.md $stage
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          $zip = Join-Path (Resolve-Path .).Path 'awake-daemon.win64.zip'
          if (Test-Path $sevenZip) {
            Push-Location $stage
            try { & $sevenZip a -tzip $zip '*' -bso0 } finally { Pop-Location }
          } else {
            Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip
          }
          if (-not (Test-Path $zip)) { throw "Packaging failed." }
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$hash  awake-daemon.win64.zip" | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-ChildItem awake-daemon.win64.zip, SHA256SUMS.txt | Format-Table Name, Length

      - name: Pick the release notes
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $notes = ".github/release-notes/$tag.md"
          if (-not (Test-Path $notes)) {
            $notes = Join-Path $env:RUNNER_TEMP "notes.md"
            @(
              "Build of tag ``$tag``.",
              "",
              "See the commit history for the changes in this release."
            ) | Set-Content -Encoding utf8 $notes
          }

          # Insert a "Full Changelog" comparison link right after the
          # "Package:" line of the release notes. The previous tag is the
          # version-sorted tag immediately before the one being released;
          # when there is none (first release), no link is added.
          git fetch --quiet origin "+refs/tags/*:refs/tags/*"
          $tags = @(@(git tag --sort="-v:refname") | Where-Object { $_ })
          $index = [array]::IndexOf($tags, $tag)
          if ($index -ge 0 -and $index -lt ($tags.Count - 1)) {
            $previous = $tags[$index + 1]
            $changelog = "**Full Changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/$previous...$tag"
            $lines = @(Get-Content $notes)
            $packageLine = $null
            for ($i = 0; $i -lt $lines.Count; $i++) {
              # Match the "Package:" line regardless of markdown backticks.
              if ($lines[$i] -match '^Package:') {
                $packageLine = $i
                break
              }
            }
            if ($null -ne $packageLine) {
              # Surround the link with blank lines. Without them Markdown folds
              # it into the "Package:" paragraph and GitHub renders both on a
              # single line, which is not what the notes look like in the repo.
              # The trailing blank line is only added when the line that follows
              # is not already empty, so the notes do not end up with a double
              # blank line.
              $updated = @($lines[0..$packageLine] + "" + $changelog)
              $nextIsBlank = (($packageLine + 1) -lt $lines.Count) -and ($lines[$packageLine + 1] -eq "")
              if (-not $nextIsBlank) { $updated += "" }
              if ($packageLine -lt ($lines.Count - 1)) {
                $updated += @($lines[($packageLine + 1)..($lines.Count - 1)])
              }
            } else {
              $updated = @($lines + "" + $changelog)
            }
            $updated | Set-Content -Encoding utf8 $notes
            Write-Host "changelog link: $changelog"
          } else {
            Write-Host "no previous tag found; the Full Changelog link is skipped"
          }

          Write-Host "using $notes"
          "path=$notes" >> $env:GITHUB_OUTPUT

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: awake ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            awake-daemon.win64.zip
            SHA256SUMS.txt
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          fail_on_unmatched_files: true
