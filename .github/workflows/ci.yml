# =============================================================================
# ci.yml - build and smoke test every change.
#
# The project is Windows only, so a Windows runner is enough. The steps use the
# same entry points a developer uses locally (utils\build.bat, the smoke test),
# which keeps CI and local builds from diverging.
#
# No toolchain configuration is committed: utils\msvc-env.ps1 finds the Visual
# Studio installation that ships with the runner image, and utils\build.ps1
# derives the matching CMake generator from it (17 -> "Visual Studio 17 2022"
# on the current images, 18 -> "Visual Studio 18 2026" on newer ones).
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Show the toolchain
        shell: cmd
        run: |
          cmake --version
          pwsh -NoProfile -Command "$PSVersionTable.PSVersion.ToString()"

      # Builds Release; the script falls back to the NMake generator when the
      # Visual Studio generator is unavailable, so a missing IDE cannot fail
      # the job silently.
      - name: Build
        shell: cmd
        run: utils\build.bat

      # The version is declared once, in CMakeLists.txt; this step makes sure
      # the binary really reports it (R8 regression guard).
      - name: Verify the version
        shell: pwsh
        run: |
          $cmakeLists = Get-Content CMakeLists.txt -Raw
          $version = [regex]::Match($cmakeLists, 'project\(awake VERSION (\d+\.\d+\.\d+)').Groups[1].Value
          $suffix = [regex]::Match($cmakeLists, 'set\(AWAKE_VERSION_SUFFIX "([^"]*)"\)').Groups[1].Value
          $expected = "$version$suffix"
          $reported = (& .\build\Release\awake.exe version) -join ' '
          Write-Host "expected: $expected"
          Write-Host "reported: $reported"
          if ($reported -notmatch [regex]::Escape($expected)) {
            Write-Error "The binary does not report the version declared in CMakeLists.txt."
            exit 1
          }

      # The unit tests run before the smoke test: they are fast and they point
      # at the module that broke instead of at a symptom in the CLI.
      - name: Unit tests
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter awake_tests.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "awake_tests.exe was not built." }
          Write-Host "running $($exe.FullName)"
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed." }

      - name: Smoke test
        shell: pwsh
        run: python utils\test\smoketest.py

      # R9: the Debug configuration carries the same tests with assertions
      # enabled; the Release build above may fold them away.
      - name: Unit tests (Debug build)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . utils\msvc-env.ps1
          $cmake = Get-CMakeCommand
          $vsRoot = Get-VisualStudioRoot
          $generator = Get-CMakeGenerator -VisualStudioRoot $vsRoot
          $platform = Get-ToolSetting -Section 'generator' -Key 'platform'
          if (-not $platform) { $platform = 'x64' }
          if ($generator -eq 'NMake Makefiles') {
            cmake -S . -B build-debug -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Debug
            cmake --build build-debug
          } else {
            cmake -S . -B build-debug -G $generator -A $platform -DCMAKE_BUILD_TYPE=Debug
            cmake --build build-debug --config Debug
          }
          $exe = Get-ChildItem -Path build-debug -Recurse -Filter awake_tests.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "awake_tests.exe (Debug) was not built." }
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "Debug unit tests failed." }

      - name: Upload the executables
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: awake-win64
          path: |
            build/Release/awake.exe
            build/Release/awake.daemon.exe
          if-no-files-found: warn

  # R9: an advisory job that builds the tree with the MSVC static analyzer
  # enabled. Findings appear in the job log without failing the build; R16
  # (release hardening) decides when analyzer findings gate a release.
  analyze:
    name: Static analysis (/analyze)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Build with /analyze
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . utils\msvc-env.ps1
          $cmake = Get-CMakeCommand
          $vsRoot = Get-VisualStudioRoot
          $generator = Get-CMakeGenerator -VisualStudioRoot $vsRoot
          $platform = Get-ToolSetting -Section 'generator' -Key 'platform'
          if (-not $platform) { $platform = 'x64' }
          if ($generator -eq 'NMake Makefiles') {
            throw "The /analyze job needs the Visual Studio generator."
          }
          cmake -S . -B build-analyze -DCMAKE_BUILD_TYPE=Release -DAWAKE_ENABLE_ANALYZE=ON -G $generator -A $platform
          cmake --build build-analyze --config Release

